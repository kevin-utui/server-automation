name: sample-api

services:
  sample-api:
    image: server-automation/sample-api:1.0.0
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sample-api

    ports:
      - "127.0.0.1:8000:8000"

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:size=16M,noexec,nosuid

    mem_limit: 256m
    cpus: 0.50

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
