---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("24.04", ">=")
    fail_msg: "This MariaDB role currently supports Ubuntu 24.04 and newer."

- name: Install MariaDB packages
  ansible.builtin.apt:
    name: "{{ mariadb_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure MariaDB log directory exists
  ansible.builtin.file:
    path: /var/log/mysql
    state: directory
    owner: mysql
    group: adm
    mode: "0750"

- name: Configure MariaDB server networking and slow-query logging
  ansible.builtin.copy:
    dest: /etc/mysql/mariadb.conf.d/60-server-automation.cnf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible. Do not edit manually.
      [mariadbd]
      bind-address = {{ mariadb_bind_address }}
      port = {{ mariadb_port }}
      slow_query_log = {{ '1' if mariadb_slow_query_log_enabled else '0' }}
      slow_query_log_file = {{ mariadb_slow_query_log_file }}
      long_query_time = {{ mariadb_slow_query_time }}
  notify: Restart MariaDB


- name: Ensure MariaDB service is enabled and running
  ansible.builtin.service:
    name: "{{ mariadb_service_name }}"
    enabled: true
    state: started
