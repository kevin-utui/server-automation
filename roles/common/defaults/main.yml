---
# Common operating-system baseline

common_timezone: Africa/Maputo

common_base_packages:
  - curl
  - ca-certificates
  - gnupg
  - rsync
  - git
  - vim
  - htop
  - lsof
  - tcpdump
  - dnsutils
  - chrony

common_manage_timezone: true
common_manage_chrony: true

# Automated security updates
common_manage_security_updates: true

common_security_update_packages:
  - unattended-upgrades
  - apt-listchanges
  - needrestart

common_apt_periodic_config: |
  APT::Periodic::Update-Package-Lists "1";
  APT::Periodic::Unattended-Upgrade "1";

# Keep unattended reboot and service restart behaviour conservative.
common_needrestart_restart_mode: "l"
