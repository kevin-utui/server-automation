---
- name: Install common administration packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Configure system timezone link
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  become: true
  when: common_manage_timezone | bool

- name: Set system timezone configuration
  ansible.builtin.copy:
    content: "{{ common_timezone }}\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_manage_timezone | bool

- name: Check whether Chrony is installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status}
      - chrony
  register: common_chrony_package
  changed_when: false
  failed_when: false
  become: true
  when: common_manage_chrony | bool

- name: Ensure Chrony service is enabled and running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  become: true
  when:
    - common_manage_chrony | bool
    - common_chrony_package.rc == 0
    - "'install ok installed' in common_chrony_package.stdout"
