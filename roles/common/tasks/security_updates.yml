---
- name: Ensure automated security update packages are installed
  ansible.builtin.apt:
    name: "{{ common_security_update_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: common_manage_security_updates | bool

- name: Enable daily APT package-list updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: "{{ common_apt_periodic_config }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_manage_security_updates | bool

- name: Disable automatic upgrades from the base release origin
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^\s*"\$\{distro_id\}:\$\{distro_codename\}";'
    state: absent
  become: true
  when: common_manage_security_updates | bool
  notify: Validate unattended-upgrades configuration

- name: Explicitly disable automatic reboots
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52server-automation-unattended
    content: |
      // Managed by Ansible: server-automation
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "false";
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_manage_security_updates | bool
  notify: Validate unattended-upgrades configuration

- name: Configure apt-listchanges for non-interactive operation
  ansible.builtin.copy:
    dest: /etc/apt/listchanges.conf
    content: |
      [apt]
      frontend=none
      confirm=false
      email_address=
      save_seen=/var/lib/apt/listchanges.db
      which=both
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_manage_security_updates | bool

- name: Configure needrestart to report required restarts without restarting services
  ansible.builtin.lineinfile:
    path: /etc/needrestart/needrestart.conf
    regexp: '^\s*\$nrconf\{restart\}\s*='
    line: "$nrconf{restart} = '{{ common_needrestart_restart_mode }}';"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_manage_security_updates | bool
