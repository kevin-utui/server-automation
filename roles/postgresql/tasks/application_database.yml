---
- name: Validate application database settings
  ansible.builtin.assert:
    that:
      - postgresql_application_database is match('^[A-Za-z_][A-Za-z0-9_]{0,62}$')
      - postgresql_application_user is match('^[A-Za-z_][A-Za-z0-9_]{0,62}$')
      - postgresql_application_user_password | string | length > 0
    fail_msg: >-
      Invalid PostgreSQL database or user name, or missing Vault password.
      Names must start with a letter or underscore and contain only
      letters, numbers, and underscores, with a maximum of 63 characters.

- name: Create PostgreSQL application user
  community.postgresql.postgresql_user:
    name: "{{ postgresql_application_user }}"
    password: "{{ postgresql_application_user_password }}"
    role_attr_flags: "LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE"
    no_password_changes: true
    state: present
  become: true
  become_user: postgres
  no_log: true

- name: Create PostgreSQL application database
  community.postgresql.postgresql_db:
    name: "{{ postgresql_application_database }}"
    owner: "{{ postgresql_application_user }}"
    state: present
  become: true
  become_user: postgres
