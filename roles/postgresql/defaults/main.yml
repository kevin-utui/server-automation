---
# PostgreSQL role defaults for Ubuntu Server 24.04.

postgresql_packages:
  - postgresql
  - postgresql-contrib
  - python3-psycopg2

postgresql_service_name: postgresql

# Do not expose PostgreSQL to the network until client access is approved.
postgresql_listen_addresses: "localhost"

# Log SQL statements taking at least this many milliseconds.
postgresql_log_min_duration_statement: 1000

# Application database management.
postgresql_manage_application_database: false
postgresql_application_database: appdb
postgresql_application_user: appuser
postgresql_application_user_password: "{{ vault_postgresql_appuser_password }}"
